name: Build and Release

# Two ways to release:
#  1. Actions tab -> "Build and Release" -> Run workflow -> enter a version (e.g. 0.8.0 or 0.8.0-rc.1).
#     The tag is created on the selected branch's HEAD.
#  2. Push a tag yourself: git tag 0.8.0 && git push origin 0.8.0
# Versions with a suffix (e.g. -rc.1) are published as pre-release.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.8.0 or 0.8.0-rc.1 (no "v" prefix)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$INPUT_VERSION"
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "::error::Tag $VERSION already exists."
              exit 1
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version (expected e.g. 0.8.0 or 0.8.0-rc.1)."
            exit 1
          fi

          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (prerelease: $PRERELEASE)"

  build:
    name: Publish ${{ matrix.rid }}
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # native virtual camera component, x64 only (the Windows camera service is 64-bit)
      - name: Setup MSBuild
        if: matrix.rid == 'win-x64'
        uses: microsoft/setup-msbuild@v3

      - name: Build Virtual Camera
        if: matrix.rid == 'win-x64'
        run: msbuild src/ScreenshareHelper.VirtualCamera/ScreenshareHelper.VirtualCamera.vcxproj -p:Configuration=Release -p:Platform=x64 -m -nologo

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: >
          dotnet publish src/ScreenshareHelper/ScreenshareHelper.csproj
          -c Release -r $env:RID -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:Version=$env:VERSION
          -p:DebugType=none
          -o publish/$env:RID

      - name: Check Virtual Camera in x64 package
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: if (-not (Test-Path "publish/win-x64/ScreenshareHelper.VirtualCamera.dll")) { throw "ScreenshareHelper.VirtualCamera.dll missing in the x64 package" }

      - name: Create ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: Compress-Archive -Path "publish/$env:RID/*" -DestinationPath "ScreenshareHelper-$env:VERSION-$env:RID.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: ScreenshareHelper-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Notes are built from commits (not PRs), because most changes are pushed to master directly.
      # Final releases compare against the previous final release, pre-releases against the previous tag.
      - name: Build Release Notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          TAGS=$(git -c versionsort.suffix=- tag --sort=-v:refname --merged HEAD | grep -vxF "$VERSION" || true)
          if [[ "$PRERELEASE" != "true" ]]; then
            TAGS=$(echo "$TAGS" | grep -v -- '-' || true)
          fi
          PREV=$(echo "$TAGS" | head -n1)

          {
            echo "## What's Changed"
            if [[ -n "$PREV" ]]; then
              git log --no-merges --pretty='* %s (%h)' "$PREV..HEAD"
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$VERSION"
            else
              git log --no-merges --pretty='* %s (%h)'
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          body_path: release-notes.md
          files: dist/*.zip
          fail_on_unmatched_files: true
